name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write   # Release yaratish uchun

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # GitHub-hosted ubuntu-latest runner already includes Android SDK.
      # Avoid android-actions/setup-android@v3 here: it may call the removed
      # legacy "tools" package and fail before the actual Gradle build starts.
      - name: Android SDK, NDK va CMake tayyorlash
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK topilmadi: $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SM" ]; then
            echo "::error::sdkmanager topilmadi: $SDK/cmdline-tools"
            find "$SDK" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "SDK manager: $SM"

          set +o pipefail
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SM" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" 2>&1 | tee sdk-install.log

          test -d "$SDK/platforms/android-34"
          test -x "$SDK/build-tools/34.0.0/apksigner"
          test -d "$SDK/ndk/27.2.12479018"
          test -d "$SDK/cmake/3.22.1"

      - name: llama.cpp manbasini olish
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Keystore'ni tayyorlash (secrets bo'lsa)
        id: ks
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Doimiy kalit topildi: signed RELEASE APK yig'iladi (eski ilova ustiga o'rnatiladi)."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Keystore secrets topilmadi: DEBUG APK yig'iladi (eski ilovani avval o'chirish kerak)."
          fi

      - name: APK yig'ish (to'liq log bilan)
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          gradle $TASK --no-daemon --stacktrace --warning-mode all 2>&1 | tee build-apk.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Build logini saqlash (xato bo'lsa ham)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-ai-build-diagnostics
          path: |
            build-apk.log
            sdk-install.log
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: APK faylini tekshirish
        if: success()
        shell: bash
        run: |
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then APK=app/build/outputs/apk/release/app-release.apk; else APK=app/build/outputs/apk/debug/app-debug.apk; fi
          test -s "$APK" || { echo "::error::APK topilmadi yoki bo'sh: $APK"; exit 1; }
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/' || { echo "::error::APK ichida native kutubxonalar yo'q"; exit 1; }

      - name: APK nomini build raqami va commit bilan belgilash
        if: success()
        shell: bash
        run: |
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then SRC=app/build/outputs/apk/release/app-release.apk; KIND=signed; else SRC=app/build/outputs/apk/debug/app-debug.apk; KIND=debug; fi
          cp "$SRC" "Talaba-AI-$KIND-run${{ github.run_number }}-${GITHUB_SHA::7}.apk"

      - name: APK'ni artifact sifatida saqlash
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: student-ai-apk-run${{ github.run_number }}
          path: Talaba-AI-*.apk
          if-no-files-found: error

      # Telefonda APK odatda GitHub > Releases dan yuklab olinadi. Avval workflow Release'ni
      # yangilamasdi, shuning uchun "Latest" 1 oy oldingi v1.0.5 bo'lib qolgandi.
      - name: Release yaratish (Latest) va APK'ni biriktirish
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" Talaba-AI-*.apk \
            --target "$GITHUB_SHA" \
            --title "Eng so'nggi build $TAG" \
            --notes "Commit: ${GITHUB_SHA::7}. Offline GGUF inference via llama.cpp va Telegram ID orqali kirish." \
            --latest
