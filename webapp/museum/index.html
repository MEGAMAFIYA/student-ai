<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Student AI — Xotiralar muzeyi</title><link rel="stylesheet" href="/miniapp/museum/style.css"></head><body><header><b>🏛 Xotiralar muzeyi</b><span id="status">Ulanmoqda…</span></header><main id="gate"><h2>O‘z xotiralar muzeyingiz</h2><p>Suratlaringizni 3D xonaga joylang va do‘stingizni taklif qiling.</p><input id="title" maxlength="80" placeholder="Muzey nomi"><button id="create">Muzey yaratish</button><p id="hint"></p></main><section id="room" hidden><div id="scene"></div><section id="photoViewer" hidden><button id="closePhoto" aria-label="Yopish">✕</button><img id="fullPhoto" alt="Muzey surati"></section><div id="speaker"><b>🔊 Muzey kolonkasi</b><span id="trackName">Musiqa yo‘q</span><div><button id="prevTrack">«</button><button id="playTrack">▶</button><button id="nextTrackControl">»</button></div><audio id="museumAudio" preload="none"></audio></div><div id="joystick" aria-label="Harakat joystigi"><div id="stick"></div></div><aside id="tools"><div class="toolHead"><h3 id="museumTitle"></h3><button id="collapseTools" aria-label="Menyuni yig‘ish">⌄</button></div><div id="toolBody"><div id="people"></div><div id="ownerTools" hidden><label class="upload">➕ Surat qo‘shish<input id="photos" type="file" accept="image/png,image/jpeg" multiple hidden></label><label class="upload">🎵 MP3 yuklash (3 tagacha)<input id="audioFiles" type="file" accept="audio/mpeg,.mp3" multiple hidden></label><div id="trackList"></div><button id="invite">🔗 Do‘stni taklif qilish</button><button id="revoke">⛔ Havolani bekor qilish</button><div id="guestList"></div><div id="qr"></div><button id="guide">🧭 Yo‘naltirish: o‘chiq</button><button id="nextPhoto">🖼 Keyingi surat</button></div><button id="follow" hidden>👣 Egaga ergashish</button><button id="help">Boshqaruv</button><p id="notice"></p></div></aside></section><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="/miniapp/museum/app.js"></script></body></html>
