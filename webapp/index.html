<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Student AI</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#0b0b0f;color:#fff;font-family:system-ui,-apple-system,sans-serif}
    .box{height:100%;display:flex;align-items:center;justify-content:center;text-align:center}
    .muted{color:#aaa;font-size:13px;margin-top:8px}
  </style>
</head>
<body>
  <div class="box"><div>⏳ <b>Student AI</b><div class="muted">Mini App ochilmoqda...</div></div></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
  (() => {
    const tg = window.Telegram && window.Telegram.WebApp;
    try { tg && tg.ready(); tg && tg.expand(); } catch(e) {}
    const p = new URLSearchParams(location.search);
    const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
    const start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) ||
                  p.get("startapp") ||
                  hashParams.get("tgWebAppStartParam") ||
                  hashParams.get("startapp") || "";

    // Main Mini App'dan boshqa sahifaga o'tganda Telegram initData URL bilan
    // birga ko'chmaydi. Shu sabab uni faqat shu origin'dagi sessionStorage'da
    // bir marta saqlab, keyingi Mini App sahifasiga xavfsiz o'tkazamiz.
    // Server baribir initData HMAC'sini tekshiradi.
    try {
      if (tg && tg.initData) {
        sessionStorage.setItem("student_ai_tg_init_data", tg.initData);
      }
    } catch (_) {}

    if (start && start.startsWith("room_")) {
      location.replace("/miniapp/kino/?room=" + encodeURIComponent(start.slice(5)));
      return;
    }
    if (start && start.startsWith("game_")) {
      location.replace("/miniapp/game/?room=" + encodeURIComponent(start.slice(5)));
      return;
    }
    if (start && start.startsWith("draw_")) {
      // Main Mini App -> rasm dueliga o'tishda initData yo'qolmasligi uchun
      // yuqoridagi sessionStorage nusxasi ishlatiladi.
      location.replace("/miniapp/rasim/?room=" + encodeURIComponent(start.slice(5)));
      return;
    }
    // Agar boshqa Mini App oqimi bo'lsa, uni bu router buzmaydi.
    document.querySelector(".muted").textContent =
      "Mini App ishga tayyor. O‘yin yoki Kino xonasini tegishli tugma orqali oching.";
  })();
  </script>
</body>
</html>
