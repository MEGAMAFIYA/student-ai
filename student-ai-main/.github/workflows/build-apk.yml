name: Build debug APK

# Bu workflow GitHub'ga push qilinganda avtomatik ravishda debug APK
# yig'adi (Android Studio shart emas). Tayyor .apk fayl "Actions" bo'limi
# > tanlangan run > "Artifacts" ostida yuklab olinadi.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle wrapper'ga ishga tushirish huquqi
        run: chmod +x ./gradlew

      - name: Debug APK yig'ish
        run: ./gradlew assembleDebug --no-daemon

      - name: APK'ni artifact sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: student-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
