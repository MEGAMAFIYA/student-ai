name: Build debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The source archive did not contain Gradle Wrapper scripts/JAR.
      # Install the compatible Gradle version directly so CI does not depend
      # on missing wrapper files.
      - name: Gradle 8.7 o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Debug APK yig'ish (to'liq log bilan)
        id: build_apk
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee build-apk.log
          build_status=${PIPESTATUS[0]}
          echo "exit_code=$build_status" >> "$GITHUB_OUTPUT"
          exit "$build_status"

      - name: Build logini saqlash (xato bo'lsa ham)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-ai-build-diagnostics
          path: |
            build-apk.log
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: APK'ni artifact sifatida saqlash
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: student-ai-debug-apk-run${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
