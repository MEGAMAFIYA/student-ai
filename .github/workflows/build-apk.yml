name: Build and Release APK

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: student-ai-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      # AGP 8.5.x requires Gradle 8.7 and JDK 17.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          cache-provider: basic

      - name: Verify build toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E 'platforms;android-34|build-tools;34.0.0|platform-tools' || true

      - name: Verify Android project structure
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradle/wrapper/gradle-wrapper.properties
          test ! -f release.keystore
          echo "Android project structure OK"

      - name: Check permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > release.keystore
          test -s release.keystore
          keytool -list -keystore release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Signing key OK"

      - name: Resolve backend URL
        env:
          REPO_BASE_URL: ${{ vars.STUDENT_AI_BASE_URL }}
        run: |
          BASE_URL="${REPO_BASE_URL:-https://student-ai-uz.onrender.com/}"
          BASE_URL="${BASE_URL%/}/"
          echo "STUDENT_AI_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "Backend URL configured: ${BASE_URL}"

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -PstudentAiBaseUrl="$STUDENT_AI_BASE_URL"

      - name: Verify generated APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 100000
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          echo "Signed APK verification OK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-ai-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or update Latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          TITLE="Eng so'nggi build $TAG"
          NOTES="Student AI signed Release APK. Build: ${GITHUB_RUN_NUMBER}."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Remove signing key
        if: always()
        run: rm -f release.keystore
